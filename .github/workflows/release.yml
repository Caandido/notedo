name: Release

# Dispara ao empurrar uma tag tipo v1.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Generate app icons
        run: npx tauri icon src-tauri/app-icon.png

      # tauri build roda `npm run build` (next build -> out/) via beforeBuildCommand,
      # depois empacota o instalador NSIS.
      - name: Build EXE (Tauri)
        run: npm run build:exe

      - name: Upload installer to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: true
          draft: true

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notedo-windows-exe
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web (out/)
        run: npm run build

      # Gera o projeto nativo android/ do zero (não versionado).
      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#0a0a0b" --iconBackgroundColorDark "#0a0a0b"

      - name: Sync web into Android
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          draft: true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notedo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
